<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>윤서네 가족앨범</title>
    <style>
        :root { --navy: #13293d; --bg: #f5f3ef; --text: #222; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: var(--bg); color: var(--text); }
        .hero { background: var(--navy); color: #fff; text-align: center; padding: 48px 16px; }
        .hero h1 { margin: 0 0 8px; font-size: 2rem; }
        .hero p { margin: 0; opacity: .8; }
        .gallery { max-width: 1100px; margin: 24px auto; padding: 0 16px; display: grid; gap: 16px;
                   grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
        .item { margin: 0; background: #fff; border-radius: 10px; overflow: hidden; cursor: pointer;
                box-shadow: 0 1px 4px rgba(0,0,0,.12); transition: transform .2s, box-shadow .2s; }
        .item:hover, .item:focus-visible { transform: translateY(-4px); box-shadow: 0 6px 14px rgba(0,0,0,.2); outline: none; }
        .item img { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; background: #ddd; }
        .item figcaption { padding: 10px 12px; font-size: .95rem; }
        .viewer { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 10; }
        .viewer.open { display: flex; }
        .viewer img { max-width: 94vw; max-height: 82vh; object-fit: contain; }
        .viewer p { color: #fff; margin: 12px 0 0; }
        .viewer button { position: absolute; background: none; border: 0; color: #fff; font-size: 2.4rem; cursor: pointer; padding: 12px; }
        .viewer .close { top: 8px; right: 12px; }
        .viewer .prev { left: 8px; top: 50%; }
        .viewer .next { right: 8px; top: 50%; }
        footer { text-align: center; color: #888; font-size: .85rem; padding: 24px; }
    </style>
</head>

<body>
    <header class="hero">
        <h1>윤서네 가족앨범</h1>
        <p>삼척솔비치 여행사진</p>
    </header>

    <main class="gallery" id="gallery"></main>

    <div class="viewer" id="viewer" role="dialog" aria-modal="true">
        <button class="close" aria-label="닫기">&times;</button>
        <button class="prev" aria-label="이전">&#8249;</button>
        <img id="viewerImg" alt="">
        <p id="viewerCap"></p>
        <button class="next" aria-label="다음">&#8250;</button>
    </div>

    <footer>사진을 누르면 크게 볼 수 있어요 (← → 키, 스와이프 가능)</footer>

    <script>
        // 사진 목록: 파일 번호와 설명만 고치면 됩니다.
        const photos = [
            [1, "윤서대디"], [2, "윤서는 홀로"], [3, "솔비치에서 바라본 바다"], [4, "삼척솔비치 4"],
            [5, "너는 누구?"], [6, "기다림"], [7, "윤서엄빠"], [8, "예쁜 윤서맘"],
            [9, "예쁜 윤서"], [10, "예쁜 윤서맘2"], [11, "예쁜 윤서맘3"], [12, "예쁜 윤서맘4"],
            [13, "예쁜 윤서맘5"], [14, "삼척솔비치 14"]
        ].map(([n, title]) => ({ title, thumb: `thumbs/solbeach-${n}.jpg`, full: `photos/solbeach-${n}.jpg` }));

        const gallery = document.getElementById("gallery");
        photos.forEach((p, i) => {
            const fig = document.createElement("figure");
            fig.className = "item";
            fig.tabIndex = 0;
            fig.innerHTML = `<img loading="lazy" src="${p.thumb}" alt="${p.title}"><figcaption>${p.title}</figcaption>`;
            fig.addEventListener("click", () => open(i));
            fig.addEventListener("keydown", e => { if (e.key === "Enter") open(i); });
            gallery.appendChild(fig);
        });

        const viewer = document.getElementById("viewer");
        const img = document.getElementById("viewerImg");
        const cap = document.getElementById("viewerCap");
        let cur = 0;
        function show(i) {
            cur = (i + photos.length) % photos.length;
            img.src = photos[cur].full; img.alt = photos[cur].title;
            cap.textContent = `${photos[cur].title} (${cur + 1}/${photos.length})`;
        }
        function open(i) { show(i); viewer.classList.add("open"); }
        function close() { viewer.classList.remove("open"); }
        viewer.querySelector(".close").onclick = close;
        viewer.querySelector(".prev").onclick = () => show(cur - 1);
        viewer.querySelector(".next").onclick = () => show(cur + 1);
        viewer.addEventListener("click", e => { if (e.target === viewer) close(); });
        document.addEventListener("keydown", e => {
            if (!viewer.classList.contains("open")) return;
            if (e.key === "Escape") close();
            if (e.key === "ArrowLeft") show(cur - 1);
            if (e.key === "ArrowRight") show(cur + 1);
        });
        let x0 = null;
        viewer.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; });
        viewer.addEventListener("touchend", e => {
            if (x0 === null) return;
            const dx = e.changedTouches[0].clientX - x0;
            if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1));
            x0 = null;
        });
    </script>
</body>

</html>
