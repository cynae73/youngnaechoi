<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
    <title>사진·영상 올리기 - 윤서네 가족앨범</title>
    <style>
        :root { --bg: #f9f2df; --card: #fffdf8; --fg: #14263d; --muted: #566275; --t1: #c4ddf2; --t2: #5f98c9; --hero-fg: #0b1f35; --line: #dcd2b8; --accent: #0b1f35; --accent-fg: #f9f2df; --ok: #1d7a46; --err: #b3261e; }
        @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f1a28; --card: #1c2c40; --fg: #f1e9d8; --muted: #a9b3c2; --t1: #274a73; --t2: #12304f; --hero-fg: #f3ecda; --line: #34404a; --accent: #f3ecda; --accent-fg: #0f1a28; --ok: #5fcf8e; --err: #ff8a80; color-scheme: dark; } }
        :root[data-theme="dark"] { --bg: #0f1a28; --card: #1c2c40; --fg: #f1e9d8; --muted: #a9b3c2; --t1: #274a73; --t2: #12304f; --hero-fg: #f3ecda; --line: #34404a; --accent: #f3ecda; --accent-fg: #0f1a28; --ok: #5fcf8e; --err: #ff8a80; color-scheme: dark; }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        #uploader { display: grid; gap: 16px; }
        body { margin: 0; min-height: 100vh; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: var(--bg); color: var(--fg); }
        a { color: inherit; }
        .hero { background: linear-gradient(180deg, var(--t1), var(--t2)); color: var(--hero-fg); text-align: center; padding: 28px 16px 22px; }
        .hero h1 { margin: 0 0 6px; font-family: "Noto Serif KR", serif; font-size: 1.6rem; }
        .wave { display: block; line-height: 0; background: var(--bg); } .wave svg { display: block; width: 100%; height: 30px; } .wave .a { fill: var(--t2); } .wave .b { fill: var(--bg); }
        .hero a { opacity: .85; font-size: .95rem; }
        main { max-width: 640px; margin: 24px auto; padding: 0 16px; display: grid; gap: 16px; }
        section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 12px; }
        h2 { margin: 0; font-size: 1.05rem; }
        label { font-size: .9rem; color: var(--muted); display: grid; gap: 6px; }
        input, select, button { font: inherit; }
        input[type=text], input[type=password], select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
        button { padding: 11px 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-fg); cursor: pointer; font-weight: 600; }
        button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); font-weight: 400; }
        button:disabled { opacity: .5; cursor: default; }
        :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
        .row { display: flex; gap: 8px; flex-wrap: wrap; }
        .row > * { flex: 1 1 140px; min-width: 0; }
        .hint { font-size: .85rem; color: var(--muted); margin: 0; }
        .msg { margin: 0; font-size: .9rem; min-height: 1.2em; }
        .msg.err { color: var(--err); }
        ul.queue { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
        ul.queue li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: .9rem; border-bottom: 1px solid var(--line); padding-bottom: 8px; min-width: 0; }
        ul.queue .name { overflow-wrap: anywhere; }
        ul.queue .st { color: var(--muted); white-space: nowrap; }
        ul.queue .st.ok { color: var(--ok); }
        ul.queue .st.err { color: var(--err); }
        .bar { grid-column: 1 / -1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
        .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
    </style>
</head>

<body>
    <header class="hero">
        <h1>사진·영상 올리기</h1>
        <a href="./">← 앨범으로 돌아가기</a>
    </header>
    <div class="wave" aria-hidden="true"><svg viewBox="0 0 1200 40" preserveAspectRatio="none"><path class="a" d="M0 0 H1200 V14 C1050 40 950 -4 800 16 C650 36 550 -2 400 16 C250 34 120 4 0 22 Z"/><path class="b" d="M0 22 C120 4 250 34 400 16 C550 -2 650 36 800 16 C950 -4 1050 40 1200 14 V40 H0 Z"/></svg></div>

    <main>
        <section id="loginBox" hidden>
            <h2>가족 비밀번호</h2>
            <form id="loginForm" class="row">
                <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" aria-label="가족 비밀번호" required>
                <button type="submit">확인</button>
            </form>
            <p class="msg err" id="loginMsg"></p>
        </section>

        <div id="uploader" hidden>
            <section>
                <h2>1. 앨범 고르기</h2>
                <label for="album">올릴 앨범
                    <select id="album"></select>
                </label>
                <form id="newAlbumForm" class="row">
                    <input id="newTitle" type="text" maxlength="60" placeholder="새 앨범 이름 (예: 2026 제주 여행)" aria-label="새 앨범 이름">
                    <button class="ghost" type="submit">앨범 만들기</button>
                </form>
                <p class="msg" id="albumMsg"></p>
            </section>

            <section>
                <h2>2. 파일 고르기</h2>
                <input id="files" type="file" multiple accept="image/*,video/mp4,video/quicktime,video/webm" aria-label="사진과 영상 선택">
                <p class="hint">사진은 올릴 때 자동으로 줄어듭니다. 영상은 1분 이내, 50MB 이하만 올릴 수 있어요. 아이폰 사진은 JPG로 변환되어 올라갑니다.</p>
                <button id="start" disabled>올리기 시작</button>
                <ul class="queue" id="queue"></ul>
            </section>

            <p class="hint" style="text-align:center"><button class="ghost" id="logout" type="button">로그아웃</button></p>
        </div>
    </main>

    <script>
        const MAX_VIDEO_BYTES = 50 * 1024 * 1024;
        const MAX_VIDEO_SEC = 60;
        const $ = id => document.getElementById(id);
        let queue = [];

        async function api(path, opts) {
            const res = await fetch(path, { credentials: "same-origin", ...opts });
            let data = {};
            try { data = await res.json(); } catch {}
            if (!res.ok) throw Object.assign(new Error(data.error || "요청에 실패했어요."), { status: res.status });
            return data;
        }

        function showLogin() { $("loginBox").hidden = false; $("uploader").hidden = true; $("pw").focus(); }
        async function showUploader() {
            $("loginBox").hidden = true; $("uploader").hidden = false;
            await loadAlbums();
        }

        async function loadAlbums(selectId) {
            try {
                const { albums } = await api("api/albums");
                $("album").innerHTML = albums.length
                    ? albums.map(a => `<option value="${a.id}">${a.title.replace(/[<&]/g, "")}</option>`).join("")
                    : `<option value="">앨범이 없어요. 아래에서 먼저 만들어 주세요.</option>`;
                if (selectId) $("album").value = selectId;
            } catch (e) { $("albumMsg").textContent = e.message; $("albumMsg").className = "msg err"; }
            updateStart();
        }

        function updateStart() { $("start").disabled = !queue.length || !$("album").value; }

        $("loginForm").addEventListener("submit", async e => {
            e.preventDefault();
            try {
                await api("api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: $("pw").value }) });
                $("pw").value = ""; $("loginMsg").textContent = "";
                showUploader();
            } catch (err) { $("loginMsg").textContent = err.message; }
        });

        $("logout").addEventListener("click", async () => { await api("api/login", { method: "DELETE" }).catch(() => {}); showLogin(); });

        $("newAlbumForm").addEventListener("submit", async e => {
            e.preventDefault();
            const title = $("newTitle").value.trim();
            if (!title) return;
            try {
                const a = await api("api/albums", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title }) });
                $("newTitle").value = ""; $("albumMsg").textContent = `'${a.title}' 앨범을 만들었어요.`; $("albumMsg").className = "msg";
                await loadAlbums(a.id);
            } catch (err) {
                if (err.status === 401) return showLogin();
                $("albumMsg").textContent = err.message; $("albumMsg").className = "msg err";
            }
        });

        $("album").addEventListener("change", updateStart);

        $("files").addEventListener("change", () => {
            queue = [...$("files").files].map(file => ({ file, li: null }));
            $("queue").innerHTML = "";
            for (const q of queue) {
                q.li = document.createElement("li");
                q.li.innerHTML = `<span class="name"></span><span class="st">대기</span><div class="bar"><i></i></div>`;
                q.li.querySelector(".name").textContent = q.file.name;
                $("queue").appendChild(q.li);
            }
            updateStart();
        });

        const setStatus = (q, text, cls = "") => { const s = q.li.querySelector(".st"); s.textContent = text; s.className = "st " + cls; };
        const setBar = (q, p) => { q.li.querySelector(".bar > i").style.width = Math.round(p * 100) + "%"; };

        function toBlob(canvas, quality) {
            return new Promise((res, rej) => canvas.toBlob(b => b ? res(b) : rej(new Error("이미지 변환에 실패했어요.")), "image/jpeg", quality));
        }
        function drawScaled(source, w, h, max) {
            const scale = Math.min(1, max / Math.max(w, h));
            const c = document.createElement("canvas");
            c.width = Math.round(w * scale); c.height = Math.round(h * scale);
            c.getContext("2d").drawImage(source, 0, 0, c.width, c.height);
            return c;
        }

        async function preparePhoto(file) {
            let bmp;
            try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); }
            catch { throw new Error("이 사진 형식은 읽을 수 없어요. (JPG, PNG 권장)"); }
            const big = drawScaled(bmp, bmp.width, bmp.height, 1600);
            const small = drawScaled(bmp, bmp.width, bmp.height, 480);
            bmp.close();
            return { file: await toBlob(big, 0.8), thumb: await toBlob(small, 0.75), type: "image/jpeg" };
        }

        function videoMime(file) {
            if (file.type) return file.type;
            const ext = file.name.split(".").pop().toLowerCase();
            return { mp4: "video/mp4", mov: "video/quicktime", webm: "video/webm" }[ext] || "";
        }

        async function prepareVideo(file) {
            const type = videoMime(file);
            if (!["video/mp4", "video/quicktime", "video/webm"].includes(type)) throw new Error("mp4, mov, webm 영상만 올릴 수 있어요.");
            if (file.size > MAX_VIDEO_BYTES) throw new Error(`영상이 너무 커요. (${(file.size / 1048576).toFixed(0)}MB, 최대 50MB)`);
            const url = URL.createObjectURL(file);
            try {
                const v = document.createElement("video");
                v.muted = true; v.playsInline = true; v.preload = "metadata"; v.src = url;
                await new Promise((res, rej) => { v.onloadedmetadata = res; v.onerror = () => rej(new Error("이 영상은 이 기기에서 읽을 수 없어요.")); });
                if (v.duration > MAX_VIDEO_SEC + 0.5) throw new Error(`영상이 너무 길어요. (${Math.round(v.duration)}초, 최대 60초)`);
                v.currentTime = Math.min(1, v.duration / 2);
                await new Promise((res, rej) => { v.onseeked = res; v.onerror = () => rej(new Error("영상 미리보기를 만들지 못했어요.")); });
                const thumb = await toBlob(drawScaled(v, v.videoWidth, v.videoHeight, 480), 0.75);
                return { file, thumb, type };
            } finally { URL.revokeObjectURL(url); }
        }

        function send(albumId, prepared, name, onProgress) {
            return new Promise((resolve, reject) => {
                const fd = new FormData();
                fd.append("album_id", albumId);
                fd.append("file", new File([prepared.file], name, { type: prepared.type }));
                fd.append("thumb", new File([prepared.thumb], "thumb.jpg", { type: "image/jpeg" }));
                const xhr = new XMLHttpRequest();
                xhr.open("POST", "api/upload");
                xhr.upload.onprogress = e => e.lengthComputable && onProgress(e.loaded / e.total);
                xhr.onload = () => {
                    let data = {};
                    try { data = JSON.parse(xhr.responseText); } catch {}
                    xhr.status < 300 ? resolve(data) : reject(Object.assign(new Error(data.error || "업로드에 실패했어요."), { status: xhr.status }));
                };
                xhr.onerror = () => reject(new Error("네트워크 오류예요. 연결을 확인해 주세요."));
                xhr.send(fd);
            });
        }

        $("start").addEventListener("click", async () => {
            const albumId = $("album").value;
            $("start").disabled = true; $("files").disabled = true;
            let done = 0;
            for (const q of queue) {
                if (q.done) continue;
                try {
                    setStatus(q, "준비 중…");
                    const isVideo = q.file.type.startsWith("video/") || /\.(mp4|mov|webm)$/i.test(q.file.name);
                    const prepared = isVideo ? await prepareVideo(q.file) : await preparePhoto(q.file);
                    setStatus(q, "올리는 중…");
                    const name = q.file.name.replace(/\.[^.]+$/, "") + (isVideo ? "." + (prepared.type.split("/")[1] === "quicktime" ? "mov" : prepared.type.split("/")[1]) : ".jpg");
                    await send(albumId, prepared, name, p => setBar(q, p));
                    setBar(q, 1); setStatus(q, "완료", "ok"); q.done = true; done++;
                } catch (err) {
                    if (err.status === 401) { showLogin(); break; }
                    setStatus(q, err.message, "err");
                }
            }
            $("files").disabled = false;
            queue = queue.filter(q => !q.done);
            $("files").value = "";
            updateStart();
        });

        (async () => {
            try { (await api("api/login")).authed ? showUploader() : showLogin(); }
            catch { showLogin(); }
        })();
    </script>
</body>

</html>
