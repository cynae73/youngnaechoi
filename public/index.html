<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>윤서네 가족앨범</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* 컨셉: 하늘색 띠 위에 네이비 잉크, 물결 아래는 아이보리 종이. 앨범은 경계에 걸쳐 붙인 폴라로이드. */
        :root {
            --t1: #c4ddf2; --t2: #5f98c9;
            --ivory: #f9f2df;
            --ink: #0b1f35; --sub: #17395d;       /* 위쪽(하늘색 띠) 글씨 */
            --bink: #14263d; --bsub: #566275;     /* 아래쪽(아이보리) 글씨 */
            --paper: #fffdf8; --pink: #14263d;    /* 폴라로이드 */
            --btn-bg: #0b1f35; --btn-fg: #f9f2df;
            --rule: rgba(11, 31, 53, .35);
            --line: rgba(20, 38, 61, .16);
            --tape: rgba(206, 178, 130, .65);
            --shadow: 0 1px 2px rgba(20, 38, 61, .14), 0 8px 18px rgba(20, 38, 61, .16);
            --ph: #e6dcc8; --err: #a61b13;
            --overlay: rgba(10, 18, 28, .95);
            --serif: "Noto Serif KR", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
            --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            --hand: "Nanum Pen Script", "Noto Sans KR", cursive;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --t1: #274a73; --t2: #12304f; --ivory: #0f1a28;
                --ink: #f3ecda; --sub: #c3d3e6; --bink: #f1e9d8; --bsub: #a9b3c2;
                --paper: #1c2c40; --pink: #f1e9d8;
                --btn-bg: #f3ecda; --btn-fg: #0f1a28; --rule: rgba(243, 236, 218, .3); --line: rgba(241, 233, 216, .16);
                --tape: rgba(241, 233, 216, .24); --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 18px rgba(0, 0, 0, .4); --ph: #22344a; --err: #ffb4ab;
                color-scheme: dark;
            }
        }
        :root[data-theme="dark"] {
            --t1: #274a73; --t2: #12304f; --ivory: #0f1a28;
            --ink: #f3ecda; --sub: #c3d3e6; --bink: #f1e9d8; --bsub: #a9b3c2;
            --paper: #1c2c40; --pink: #f1e9d8;
            --btn-bg: #f3ecda; --btn-fg: #0f1a28; --rule: rgba(243, 236, 218, .3); --line: rgba(241, 233, 216, .16);
            --tape: rgba(241, 233, 216, .24); --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 18px rgba(0, 0, 0, .4); --ph: #22344a; --err: #ffb4ab;
            color-scheme: dark;
        }

        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        html { scroll-behavior: smooth; }
        html.lock { overflow: hidden; }
        body { margin: 0; min-height: 100vh; background: var(--ivory); color: var(--bink); font: 400 1rem/1.7 var(--sans); overflow-x: hidden; }
        a { color: inherit; }
        button { font: inherit; color: inherit; }
        :focus-visible { outline: 3px solid currentColor; outline-offset: 3px; border-radius: 4px; }
        img { max-width: 100%; }

        .wrap { width: 100%; max-width: 1080px; margin-inline: auto; padding-inline: 20px; }

        /* 위쪽: 하늘색 띠 */
        .top { background: linear-gradient(180deg, var(--t1), var(--t2)); color: var(--ink); padding-bottom: 28px; }
        .top.home { padding-bottom: 70px; }
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 16px; }
        .topbar .btn { padding: 0 14px; }
        .brand { font-family: var(--hand); font-size: clamp(1.7rem, 7.4vw, 2.15rem); line-height: 1; text-decoration: none; color: var(--ink); white-space: nowrap; }
        .brand::after { content: ""; display: block; height: 7px; margin-top: 3px; opacity: .7;
            background: radial-gradient(circle at 4px 3px, transparent 3px, currentColor 3.5px, currentColor 4.5px, transparent 5px) 0 0 / 12px 7px repeat-x; }
        .btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border: 1.5px solid var(--btn-bg); border-radius: 999px; text-decoration: none;
               font-weight: 500; font-size: .92rem; background: var(--btn-bg); color: var(--btn-fg); cursor: pointer; transition: opacity .2s; white-space: nowrap; }
        .btn:hover { opacity: .85; }
        .btn.ghost { background: transparent; color: var(--bink); border-color: var(--bink); }

        /* 물결 */
        .wave { display: block; line-height: 0; background: var(--ivory); }
        .wave svg { display: block; width: 100%; height: 38px; }
        .wave .a { fill: var(--t2); }
        .wave .b { fill: var(--ivory); }

        /* 소개 */
        .hero { display: grid; grid-template-columns: 1fr; gap: 24px; padding-block: 8px 4px; align-items: center; }
        .eyebrow { font-family: var(--hand); font-size: 1.9rem; color: var(--sub); margin: 0; line-height: 1.15; }
        .hero h1 { font-family: var(--serif); font-weight: 700; font-size: clamp(2rem, 7vw, 3.4rem); line-height: 1.22; margin: 4px 0 12px; text-wrap: balance; }
        .hero p.lead { margin: 0 0 16px; color: var(--sub); max-width: 30em; }
        .stats { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 0; padding: 12px 0 0; list-style: none; border-top: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
        .stats li { color: var(--sub); font-size: .95rem; }
        .stats b { color: var(--ink); font-family: var(--serif); font-size: 1.25rem; margin-right: 2px; }
        .hero-photo { display: none; }

        .sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 18px; }
        .sec-title h2 { font-family: var(--serif); font-size: 1.3rem; margin: 0; }
        .sec-title span { color: var(--bsub); font-size: .9rem; }
        .top .sec-title { margin: 26px 0 0; }
        .top .sec-title span { color: var(--sub); }

        /* 폴라로이드 */
        .polaroid { position: relative; display: block; background: var(--paper); color: var(--pink); padding: 10px 10px 8px; border-radius: 3px; box-shadow: var(--shadow);
                    text-decoration: none; transition: transform .25s ease, box-shadow .25s ease; }
        .polaroid::before { content: ""; position: absolute; top: -11px; left: 50%; width: 70px; height: 22px; margin-left: -35px; background: var(--tape); transform: rotate(-2deg); }
        .polaroid .frame { display: block; aspect-ratio: 1 / 1; background: var(--ph); overflow: hidden; }
        .polaroid img { display: block; width: 100%; height: 100%; object-fit: cover; }
        .polaroid .cap { display: block; padding: 10px 4px 4px; }
        .polaroid .name { display: block; font-family: var(--hand); font-size: 1.45rem; line-height: 1.15; overflow-wrap: anywhere; }
        .polaroid .meta { display: block; font-size: .85rem; color: var(--bsub); font-variant-numeric: tabular-nums; }
        .hero-photo .polaroid { max-width: 250px; }

        section { padding-block: 24px; }
        .bottom { background: var(--ivory); }
        .bottom .wrap { padding-bottom: 8px; }

        /* 앨범 목록: 위쪽 띠와 물결에 걸치게 올림 */
        .albums { display: grid; gap: 30px 18px; align-items: start; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr));
                  transform: translateY(-58px); margin-bottom: -58px; position: relative; z-index: 2; }
        .albums .polaroid:nth-child(odd) { transform: rotate(-1deg); }
        .albums .polaroid:nth-child(even) { transform: rotate(1.1deg); }
        .albums .polaroid:hover, .albums .polaroid:focus-visible { transform: rotate(0) translateY(-6px); box-shadow: 0 2px 4px rgba(20, 38, 61, .16), 0 16px 30px rgba(20, 38, 61, .2); }

        /* 최근 사진 줄 */
        .strip { display: flex; gap: 12px; overflow-x: auto; padding: 4px 20px 14px; margin-inline: -20px; scroll-snap-type: x proximity; scroll-padding-inline: 20px; -webkit-overflow-scrolling: touch; }
        .strip .tile { flex: 0 0 auto; width: 132px; scroll-snap-align: start; }

        /* 사진 칸 */
        .tile { position: relative; display: block; padding: 0; border: 0; background: var(--ph); border-radius: 4px; overflow: hidden; cursor: pointer; aspect-ratio: 1 / 1; }
        .tile img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .35s ease; }
        .tile:hover img { transform: scale(1.04); }
        .tile .play { position: absolute; right: 8px; bottom: 8px; display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px; border-radius: 999px; background: rgba(10, 18, 28, .72); color: #fff; font-size: .8rem; }
        .tile .play::before { content: ""; border-style: solid; border-width: 5px 0 5px 8px; border-color: transparent transparent transparent #fff; }
        .photos { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); }
        .photos .tile { aspect-ratio: 4 / 3; }

        /* 앨범 상세 머리 */
        .back { display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; color: var(--sub); }
        .back:hover { color: var(--ink); }
        .album-head h1 { font-family: var(--serif); font-size: clamp(1.8rem, 5.5vw, 2.6rem); margin: 0 0 6px; line-height: 1.25; text-wrap: balance; }
        .album-head p { margin: 0; color: var(--sub); }

        .empty { text-align: center; padding: 40px 16px; color: var(--bsub); }
        .empty .hand { font-family: var(--hand); font-size: 2rem; color: var(--bink); display: block; margin-bottom: 6px; }

        footer { margin-top: 12px; border-top: 1px solid var(--line); padding-block: 26px 40px; text-align: center; color: var(--bsub); font-size: .9rem; }
        footer p { margin: 10px 0 0; }

        /* 확대 보기 */
        .viewer { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center; background: var(--overlay); padding: 56px 12px 20px; }
        .viewer.open { display: flex; }
        .viewer .media { display: flex; align-items: center; justify-content: center; max-width: 100%; }
        .viewer img, .viewer video { max-width: 94vw; max-height: 78vh; object-fit: contain; border-radius: 2px; }
        .viewer .caption { margin: 14px 0 0; color: #f1e9d8; text-align: center; max-width: 90vw; }
        .viewer .caption small { display: block; color: #b8c0cc; font-variant-numeric: tabular-nums; }
        .viewer button { position: absolute; width: 48px; height: 48px; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .12); color: #fff; font-size: 1.8rem; line-height: 1; cursor: pointer; }
        .viewer button:hover { background: rgba(255, 255, 255, .24); }
        .viewer button:focus-visible { outline-color: #fff; }
        .viewer .close { top: calc(10px + env(safe-area-inset-top, 0px)); right: 12px; }
        .viewer .prev { left: 10px; top: 50%; margin-top: -24px; }
        .viewer .next { right: 10px; top: 50%; margin-top: -24px; }

        /* 편집 도구 */
        .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 14px; }
        .btn.sm { min-height: 40px; padding: 0 14px; font-size: .88rem; }
        .btn.outline { background: transparent; color: var(--ink); border-color: var(--ink); }
        .btn.danger { background: #b3261e; border-color: #b3261e; color: #fff; }
        .btn:disabled { opacity: .4; cursor: default; }
        .status { font-size: .88rem; color: var(--sub); margin: 10px 0 0; min-height: 1.4em; }
        .status.err { color: var(--err); font-weight: 700; }
        .confirm { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--paper); color: var(--pink); display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; box-shadow: var(--shadow); }
        .confirm p { margin: 0; flex: 1 1 220px; }
        .confirm .btn.outline { color: var(--pink); border-color: var(--pink); }
        .tile.editable { cursor: pointer; }
        .tile.editable.sel { outline: 4px solid #2a78c2; outline-offset: -4px; }
        .tile.editable.sel img { opacity: .55; }
        .tile.editable .chk { position: absolute; top: 8px; left: 8px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; background: rgba(10, 18, 28, .5); color: #fff; display: grid; place-items: center; font-size: .95rem; }
        .tile.editable.sel .chk { background: #2a78c2; }
        .tile.editable .idx { position: absolute; top: 8px; right: 8px; background: rgba(10, 18, 28, .7); color: #fff; font-size: .75rem; padding: 1px 9px; border-radius: 999px; font-variant-numeric: tabular-nums; }
        .tile.editable .play { bottom: 54px; }
        .tile .mv { position: absolute; bottom: 6px; width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .9); color: #14263d; font-size: 1rem; line-height: 1; cursor: pointer; }
        .tile .mv.prev { left: 6px; } .tile .mv.next { right: 6px; }
        .tile .mv:disabled { opacity: .35; cursor: default; }
        .tile.over { outline: 4px dashed #2a78c2; outline-offset: -4px; }
        .tile.dragging { opacity: .4; }
        .tile .tcap { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 8px 6px; font-size: .78rem; line-height: 1.3; color: #fff; text-align: left;
                      background: linear-gradient(180deg, transparent, rgba(10, 18, 28, .78)); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .tile .play { z-index: 1; }
        .tile .mv.edit { left: 50%; margin-left: -22px; font-size: 1.1rem; }
        .tile .mv.edit.has { background: #f3d98f; }
        .confirm select { min-height: 40px; max-width: 100%; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--pink); font: inherit; }
        .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        .dlg { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(10, 18, 28, .7); }
        .dlg[hidden] { display: none; }
        .dlgbox { width: 100%; max-width: 420px; background: var(--paper); color: var(--pink); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); display: grid; gap: 12px; }
        .dlgbox h2 { margin: 0; font-family: var(--serif); font-size: 1.15rem; }
        .dlgbox img { display: block; width: 100%; max-height: 38vh; object-fit: contain; background: var(--ph); border-radius: 6px; }
        .dlgbox input { width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; font: inherit; }
        .dlgbox .row { display: flex; gap: 8px; }
        .dlgbox .btn.outline { color: var(--pink); border-color: var(--pink); }
        .dlgbox .status { color: var(--bsub); margin: 0; }
        .viewer { padding-bottom: 88px; }
        .viewer img, .viewer video { max-height: 70vh; }
        .viewer .controls { position: absolute; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; gap: 10px; }
        .viewer .controls button { position: static; width: auto; min-width: 48px; height: 48px; padding: 0 18px; border-radius: 999px; font-size: 1rem; }
        .viewer .progress { position: absolute; top: 0; left: 0; right: 0; height: 4px; background: rgba(255, 255, 255, .2); }
        .viewer .progress[hidden] { display: none; }
        .viewer .progress i { display: block; height: 100%; width: 0; background: #f3d98f; }
        .viewer .music { top: calc(10px + env(safe-area-inset-top, 0px)); left: 12px; font-size: 1.5rem; }
        .viewer .music.off { opacity: .6; }
        .viewer .music.off::after { content: ""; position: absolute; left: 11px; right: 11px; top: 50%; border-top: 3px solid #fff; transform: rotate(-40deg); }

        @media (min-width: 720px) {
            .wrap { padding-inline: 32px; }
            .hero { grid-template-columns: 1.15fr .85fr; gap: 56px; padding-block: 20px 4px; }
            .hero-photo { display: block; justify-self: center; width: 100%; max-width: 270px; transform: rotate(2.2deg); }
            .strip { padding-inline: 32px; margin-inline: -32px; scroll-padding-inline: 32px; }
            .strip .tile { width: 160px; }
            .albums { gap: 36px 24px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); }
            .polaroid .name { font-size: 1.7rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .polaroid, .tile img, .btn { transition: none; }
            .albums .polaroid:hover, .albums .polaroid:focus-visible { transform: none; }
        }
    </style>
</head>

<body>
    <div class="top" id="top">
        <div class="wrap">
            <header class="topbar">
                <a class="brand" href="#/">윤서네 가족앨범</a>
                <a class="btn" href="upload.html">사진·영상 올리기</a>
            </header>
            <div id="head"></div>
        </div>
    </div>
    <div class="wave" aria-hidden="true"><svg viewBox="0 0 1200 40" preserveAspectRatio="none"><path class="a" d="M0 0 H1200 V14 C1050 40 950 -4 800 16 C650 36 550 -2 400 16 C250 34 120 4 0 22 Z"/><path class="b" d="M0 22 C120 4 250 34 400 16 C550 -2 650 36 800 16 C950 -4 1050 40 1200 14 V40 H0 Z"/></svg></div>
    <div class="bottom">
        <div class="wrap">
            <main id="main"></main>
            <footer>
                <a class="btn ghost" href="upload.html">사진·영상 올리기</a>
                <p>사진을 누르면 크게 볼 수 있어요. 키보드 ← → 와 스와이프로 넘겨 보세요.</p>
            </footer>
        </div>
    </div>

    <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="사진 크게 보기">
        <button class="music" id="musicBtn" aria-label="음악 끄기" hidden>♪</button>
        <button class="close" aria-label="닫기">&times;</button>
        <button class="prev" aria-label="이전 사진">&#8249;</button>
        <div class="media" id="viewerMedia"></div>
        <p class="caption" id="viewerCap"></p>
        <button class="next" aria-label="다음 사진">&#8250;</button>
        <div class="progress" id="progress" hidden><i id="progressBar"></i></div>
        <div class="controls">
            <button id="playBtn" type="button" aria-label="자동 재생 시작">▶ 자동 재생</button>
            <button id="speedBtn" type="button" aria-label="사진 넘기는 간격 바꾸기">4초</button>
        </div>
    </div>

    <div class="dlg" id="capDlg" role="dialog" aria-modal="true" aria-labelledby="capDlgT" hidden>
        <form class="dlgbox" id="capForm">
            <h2 id="capDlgT">사진 설명</h2>
            <img id="capImg" alt="">
            <label for="capInput" class="vh">사진 설명</label>
            <input id="capInput" type="text" maxlength="100" placeholder="예: 처음 바다를 본 날" autocomplete="off">
            <p class="status" id="capMsg" role="status"></p>
            <div class="row"><button class="btn sm" type="submit">저장</button><button class="btn sm outline" type="button" id="capCancel">취소</button></div>
        </form>
    </div>

    <script>
        // 앨범 데이터: 서버(api/albums)에서 읽고, 서버가 없으면 data/albums.json(샘플)을 씁니다.
        // 샘플 앨범(솔비치)은 서버 앨범 뒤에 함께 보여주며, 편집(삭제·순서)은 서버 앨범만 됩니다.
        const main = document.getElementById("main");
        const head = document.getElementById("head");
        const topEl = document.getElementById("top");
        const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

        let albums = [], authed = false, schema = 2;
        let editing = false, confirmKind = "", statusMsg = "", statusErr = false;
        const selected = new Set();

        async function load(url) {
            try {
                const res = await fetch(url, { credentials: "same-origin" });
                if (!res.ok || !(res.headers.get("content-type") || "").includes("json")) return null;
                return await res.json();
            } catch (e) { return null; }
        }
        async function api(path, opts) {
            const res = await fetch(path, { credentials: "same-origin", ...opts });
            let data = {};
            try { data = await res.json(); } catch {}
            if (!res.ok) throw Object.assign(new Error(data.error || "요청에 실패했어요."), { status: res.status });
            return data;
        }
        async function loadAlbums() {
            const [live, sample] = await Promise.all([load("api/albums"), load("data/albums.json")]);
            const liveList = live?.albums || [];
            schema = live?.schema || 2;
            const ids = new Set(liveList.map(a => a.id));
            albums = [...liveList, ...(sample?.albums || []).filter(a => !ids.has(a.id)).map(a => ({ ...a, sample: true }))];
        }
        async function init() {
            const me = await load("api/login");
            authed = !!(me && me.authed);
            await loadAlbums();
            window.addEventListener("hashchange", () => { editing = false; confirmKind = ""; statusMsg = ""; selected.clear(); render(); });
            render();
        }

        const count = (items, type) => items.filter(i => i.type === type).length;
        function monthLabel(ts) {
            if (!ts) return "";
            const d = new Date(ts);
            return `${d.getFullYear()}년 ${d.getMonth() + 1}월`;
        }
        function albumMeta(a) {
            const v = count(a.items, "video"), p = a.items.length - v;
            return [monthLabel(a.created_at), `사진 ${p}`, v ? `영상 ${v}` : ""].filter(Boolean).join(" · ");
        }

        function currentAlbum() {
            const id = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
            return albums.find(a => a.id === id);
        }
        function draw() { const a = currentAlbum(); a ? renderAlbum(a) : renderHome(); }
        function render() { draw(); window.scrollTo(0, 0); }

        function polaroid(a) {
            return `<a class="polaroid" href="#/${encodeURIComponent(a.id)}">
                <span class="frame">${a.cover ? `<img loading="lazy" src="${esc(a.cover)}" alt="">` : ""}</span>
                <span class="cap"><span class="name">${esc(a.title)}</span><span class="meta">${esc(albumMeta(a))}</span></span>
            </a>`;
        }

        let recent = [];
        function renderHome() {
            document.title = "윤서네 가족앨범";
            topEl.classList.add("home");
            if (!albums.length) {
                head.innerHTML = `<div class="hero"><div><p class="eyebrow">우리 가족의 시간</p><h1>함께한 순간을<br>차곡차곡 모아요</h1></div></div>`;
                main.innerHTML = `<div class="empty"><span class="hand">아직 앨범이 없어요</span>오른쪽 위 '사진·영상 올리기'에서 첫 앨범을 만들어 보세요.</div>`;
                return;
            }
            const all = albums.flatMap(a => a.items);
            const photos = count(all, "photo"), videos = count(all, "video");
            recent = albums.flatMap(a => a.items.slice(-6).reverse().map(it => ({ ...it, album: a.title, music: a.music }))).slice(0, 12);

            head.innerHTML = `
                <div class="hero">
                    <div>
                        <p class="eyebrow">우리 가족의 시간</p>
                        <h1>함께한 순간을<br>차곡차곡 모았어요</h1>
                        <p class="lead">여행, 생일, 평범한 하루까지. 가족이 찍은 사진과 영상을 한곳에서 편하게 꺼내 보세요.</p>
                        <ul class="stats">
                            <li><b>${albums.length}</b>앨범</li>
                            <li><b>${photos.toLocaleString("ko-KR")}</b>사진</li>
                            <li><b>${videos.toLocaleString("ko-KR")}</b>영상</li>
                        </ul>
                    </div>
                    <div class="hero-photo">${polaroid(albums[0])}</div>
                </div>
                <div class="sec-title"><h2>앨범</h2><span>${albums.length}개</span></div>`;

            main.innerHTML = `
                <div class="albums">${albums.map(polaroid).join("")}</div>
                ${recent.length ? `<section aria-labelledby="recentTitle">
                    <div class="sec-title"><h2 id="recentTitle">최근 올라온 사진</h2><span>옆으로 넘겨 보세요</span></div>
                    <div class="strip" id="strip">${recent.map((it, i) => `
                        <button class="tile" data-i="${i}" aria-label="${esc(it.title || it.album)} 크게 보기">
                            <img loading="lazy" src="${esc(it.thumb)}" alt="">
                            ${it.type === "video" ? `<span class="play">영상</span>` : ""}
                        </button>`).join("")}</div>
                </section>` : ""}`;
        }

        /* ---------- 앨범 보기 / 편집 ---------- */
        let albumItems = [];
        const canEdit = a => authed && !a.sample;
        let moveTarget = "";

        function renderAlbum(a) {
            document.title = `${a.title} - 윤서네 가족앨범`;
            topEl.classList.remove("home");
            const info = [a.description, albumMeta(a), a.music ? `♪ ${a.music.title}` : ""].filter(Boolean).join(" · ");
            head.innerHTML = `
                <div class="album-head">
                    <a class="back" href="#/">← 전체 앨범</a>
                    <h1>${esc(a.title)}</h1>
                    <p>${esc(info)}</p>
                    <div id="toolsWrap"></div>
                </div>`;
            renderTools(a);
            main.innerHTML = `<section id="photosWrap"></section>`;
            renderPhotos(a);
        }

        function renderTools(a) {
            const wrap = document.getElementById("toolsWrap");
            if (!wrap) return;
            if (!editing || !canEdit(a)) {
                wrap.innerHTML = `<div class="tools">${a.items.length ? `<button class="btn sm" data-slide="1">▶ 슬라이드쇼</button>` : ""}${canEdit(a) ? `<button class="btn sm outline" data-act="edit">편집</button>` : ""}</div>`;
                return;
            }
            const n = selected.size;
            const others = albums.filter(x => x.id !== a.id && !x.sample);
            const confirm = confirmKind === "items"
                ? `<div class="confirm" role="alertdialog"><p><b>${n}개</b>를 영구 삭제할까요? 되돌릴 수 없어요.</p><button class="btn sm danger" data-act="delok">삭제</button><button class="btn sm outline" data-act="cancel">취소</button></div>`
                : confirmKind === "move"
                ? `<div class="confirm" role="dialog"><p><b>${n}개</b>를 옮길 앨범을 고르세요. 새 앨범의 맨 뒤에 붙어요.</p>${others.length
                    ? `<select id="moveTo" aria-label="이동할 앨범">${others.map(x => `<option value="${esc(x.id)}"${x.id === moveTarget ? " selected" : ""}>${esc(x.title)}</option>`).join("")}</select><button class="btn sm" data-act="moveok">이동</button>`
                    : `<span>옮길 다른 앨범이 없어요. 올리기 화면에서 앨범을 먼저 만들어 주세요.</span>`}<button class="btn sm outline" data-act="cancel">취소</button></div>`
                : confirmKind === "album"
                ? `<div class="confirm" role="alertdialog"><p>앨범 '<b>${esc(a.title)}</b>'과 안의 사진·영상 ${a.items.length}개를 모두 삭제할까요? 되돌릴 수 없어요.</p><button class="btn sm danger" data-act="delalbumok">앨범 삭제</button><button class="btn sm outline" data-act="cancel">취소</button></div>`
                : "";
            wrap.innerHTML = `
                <div class="tools">
                    <button class="btn sm" data-act="done">완료</button>
                    <button class="btn sm danger" data-act="del" ${n ? "" : "disabled"}>선택 삭제${n ? ` (${n})` : ""}</button>
                    <button class="btn sm outline" data-act="move" ${n ? "" : "disabled"}>다른 앨범으로 이동</button>
                    <button class="btn sm outline" data-act="all" ${a.items.length ? "" : "disabled"}>${n && n === a.items.length ? "선택 해제" : "모두 선택"}</button>
                    <a class="btn sm outline" href="upload.html?album=${encodeURIComponent(a.id)}#music">음악 바꾸기</a>
                    <button class="btn sm outline" data-act="delalbum">앨범 삭제</button>
                </div>
                <p class="status${statusErr ? " err" : ""}" id="status" role="status">${esc(statusMsg || "사진을 눌러 고르고, ◀ ▶ 버튼이나 끌어서 순서를 바꿔요.")}</p>
                ${schema < 2 ? `<p class="status err">순서 변경과 음악을 쓰려면 D1 업데이트가 필요해요. (docs/SETUP.md 참고)</p>` : ""}
                ${confirm}`;
        }

        function setStatus(msg, err = false) {
            statusMsg = msg; statusErr = err;
            const el = document.getElementById("status");
            if (el) { el.textContent = msg; el.classList.toggle("err", err); }
        }

        function renderPhotos(a) {
            const wrap = document.getElementById("photosWrap");
            const view = editing && canEdit(a);
            albumItems = a.items.map(it => ({ ...it, music: a.music }));
            if (!a.items.length) {
                wrap.innerHTML = `<div class="empty"><span class="hand">비어 있는 앨범이에요</span>'사진·영상 올리기'에서 첫 사진을 올려 보세요.</div>`;
                return;
            }
            wrap.innerHTML = `<div class="photos" id="photos">${a.items.map((it, i) => view
                ? `<div class="tile editable${selected.has(it.id) ? " sel" : ""}" draggable="true" data-i="${i}" data-id="${esc(it.id)}" role="checkbox" aria-checked="${selected.has(it.id)}" tabindex="0" aria-label="${i + 1}번째 ${it.type === "video" ? "영상" : "사진"} 선택">
                        <img loading="lazy" src="${esc(it.thumb)}" alt="" draggable="false">
                        <span class="chk">${selected.has(it.id) ? "✓" : ""}</span><span class="idx">${i + 1}</span>
                        ${it.type === "video" ? `<span class="play">영상</span>` : ""}
                        <button class="mv prev" data-mv="-1" aria-label="앞으로 옮기기" ${i === 0 ? "disabled" : ""}>◀</button>
                        <button class="mv edit${it.title ? " has" : ""}" data-edit="1" aria-label="${it.title ? "설명 고치기" : "설명 쓰기"}">✎</button>
                        <button class="mv next" data-mv="1" aria-label="뒤로 옮기기" ${i === a.items.length - 1 ? "disabled" : ""}>▶</button>
                    </div>`
                : `<button class="tile" data-i="${i}" aria-label="${esc(it.title || a.title)} 크게 보기">
                        <img loading="lazy" src="${esc(it.thumb)}" alt="${esc(it.title)}">
                        ${it.type === "video" ? `<span class="play">영상</span>` : ""}
                        ${it.title ? `<span class="tcap">${esc(it.title)}</span>` : ""}
                    </button>`).join("")}</div>`;
        }

        /* 순서 변경: 바뀐 뒤 0.5초 기다렸다가 한 번에 저장 */
        let saveTimer = null, pendingAlbum = null;
        function scheduleSave(a) {
            pendingAlbum = a.id;
            setStatus("순서를 바꿨어요. 저장하는 중…");
            clearTimeout(saveTimer);
            saveTimer = setTimeout(flushSave, 500);
        }
        async function flushSave() {
            clearTimeout(saveTimer);
            const id = pendingAlbum;
            if (!id) return;
            pendingAlbum = null;
            const a = albums.find(x => x.id === id);
            if (!a) return;
            try {
                await api(`api/albums/${encodeURIComponent(id)}/order`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ids: a.items.map(it => it.id) }) });
                setStatus("순서를 저장했어요.");
            } catch (err) { handleError(err, "순서를 저장하지 못했어요. "); }
        }
        function handleError(err, prefix = "") {
            if (err.status === 401) { authed = false; setStatus("로그인이 풀렸어요. '사진·영상 올리기'에서 다시 로그인해 주세요.", true); }
            else setStatus(prefix + err.message, true);
        }

        function move(a, from, to, focusDir) {
            if (to < 0 || to >= a.items.length || from === to) return;
            const [it] = a.items.splice(from, 1);
            a.items.splice(to, 0, it);
            a.cover = a.items[0]?.thumb || "";
            renderPhotos(a);
            scheduleSave(a);
            if (focusDir) {
                const t = document.querySelector(`.tile[data-id="${CSS.escape(it.id)}"]`);
                const b = t && (t.querySelector(`.mv[data-mv="${focusDir}"]:not([disabled])`) || t.querySelector(".mv:not([disabled])"));
                if (b) b.focus();
            }
        }

        function toggleSelect(a, tile) {
            const id = tile.dataset.id;
            selected.has(id) ? selected.delete(id) : selected.add(id);
            const on = selected.has(id);
            tile.classList.toggle("sel", on);
            tile.setAttribute("aria-checked", on);
            tile.querySelector(".chk").textContent = on ? "✓" : "";
            if (confirmKind === "items" && !selected.size) confirmKind = "";
            renderTools(a);
        }

        head.addEventListener("click", async e => {
            const slide = e.target.closest("[data-slide]");
            if (slide) {
                const al = currentAlbum();
                if (al && al.items.length) openViewer(al.items.map(it => ({ ...it, music: al.music })), 0, slide, true);
                return;
            }
            const btn = e.target.closest("[data-act]");
            const a = currentAlbum();
            if (!btn || !a || !canEdit(a)) return;
            const act = btn.dataset.act;
            try {
                if (act === "edit") { editing = true; selected.clear(); confirmKind = ""; statusMsg = ""; draw(); }
                else if (act === "done") { await flushSave(); editing = false; confirmKind = ""; selected.clear(); statusMsg = ""; draw(); }
                else if (act === "all") {
                    if (selected.size === a.items.length) selected.clear(); else a.items.forEach(it => selected.add(it.id));
                    confirmKind = ""; renderTools(a); renderPhotos(a);
                }
                else if (act === "del") { confirmKind = "items"; renderTools(a); }
                else if (act === "delalbum") { confirmKind = "album"; renderTools(a); }
                else if (act === "move") { moveTarget = ""; confirmKind = "move"; renderTools(a); }
                else if (act === "moveok") {
                    const to = document.getElementById("moveTo").value;
                    const ids = a.items.filter(it => selected.has(it.id)).map(it => it.id);   // 지금 보이는 순서 그대로
                    const dest = albums.find(x => x.id === to);
                    setStatus("옮기는 중…");
                    await api("api/items/move", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ids, album_id: to }) });
                    selected.clear(); confirmKind = "";
                    await loadAlbums();
                    statusMsg = `${ids.length}개를 '${dest ? dest.title : "다른"}' 앨범으로 옮겼어요.`; statusErr = false;
                    draw();
                }
                else if (act === "cancel") { confirmKind = ""; renderTools(a); }
                else if (act === "delok") {
                    const ids = [...selected];
                    setStatus("삭제하는 중…");
                    await api("api/items/delete", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ids }) });
                    selected.clear(); confirmKind = "";
                    await loadAlbums();
                    statusMsg = `${ids.length}개를 삭제했어요.`; statusErr = false;
                    draw();
                }
                else if (act === "delalbumok") {
                    setStatus("앨범을 삭제하는 중…");
                    await api(`api/albums/${encodeURIComponent(a.id)}`, { method: "DELETE" });
                    editing = false; confirmKind = "";
                    await loadAlbums();
                    location.hash = "#/";
                }
            } catch (err) { confirmKind = ""; renderTools(a); handleError(err, "실패했어요. "); }
        });

        head.addEventListener("change", e => { if (e.target.id === "moveTo") moveTarget = e.target.value; });

        /* 앨범 카드를 누르면 첫 사진부터 슬라이드쇼로 열림 (Ctrl·⌘ 클릭은 새 탭으로 그대로) */
        function onCardClick(e) {
            if (e.defaultPrevented || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
            const card = e.target.closest("a.polaroid");
            if (!card) return;
            const id = decodeURIComponent((card.getAttribute("href") || "").replace(/^#\/?/, ""));
            const al = albums.find(x => x.id === id);
            if (!al || !al.items.length) return;          // 비어 있으면 그냥 앨범 화면으로
            e.preventDefault();
            location.hash = "#/" + encodeURIComponent(id); // 닫으면 이 앨범의 사진 목록이 보임
            openViewer(al.items.map(it => ({ ...it, music: al.music })), 0, card, true);
        }
        head.addEventListener("click", onCardClick);
        main.addEventListener("click", onCardClick);

        /* 사진 칸 누르기 */
        main.addEventListener("click", e => {
            const t = e.target.closest(".tile");
            if (!t) return;
            const a = currentAlbum();
            if (t.classList.contains("editable")) {
                if (e.target.closest("[data-edit]")) { openCaption(a, +t.dataset.i); return; }
                const mv = e.target.closest(".mv");
                if (mv) { if (!mv.disabled) { const i = +t.dataset.i; move(a, i, i + (+mv.dataset.mv), mv.dataset.mv); } return; }
                toggleSelect(a, t);
                return;
            }
            const i = +t.dataset.i;
            if (t.closest("#strip")) openViewer(recent, i, t);
            else openViewer(albumItems, i, t);
        });
        main.addEventListener("keydown", e => {
            const t = e.target.closest(".tile.editable");
            if (t && e.target === t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggleSelect(currentAlbum(), t); }
        });

        /* 끌어서 순서 바꾸기 (컴퓨터). 휴대폰은 ◀ ▶ 버튼을 쓰세요. */
        let dragId = null;
        main.addEventListener("dragstart", e => {
            const t = e.target.closest(".tile.editable");
            if (!t) return;
            dragId = t.dataset.id;
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", dragId);
            t.classList.add("dragging");
        });
        main.addEventListener("dragover", e => {
            const t = e.target.closest(".tile.editable");
            if (!t || !dragId) return;
            e.preventDefault();
            document.querySelectorAll(".tile.over").forEach(x => x.classList.remove("over"));
            t.classList.add("over");
        });
        main.addEventListener("drop", e => {
            const t = e.target.closest(".tile.editable");
            if (!t || !dragId) return;
            e.preventDefault();
            const a = currentAlbum();
            const from = a.items.findIndex(it => it.id === dragId);
            move(a, from, +t.dataset.i);
            dragId = null;
        });
        main.addEventListener("dragend", () => {
            dragId = null;
            document.querySelectorAll(".tile.over, .tile.dragging").forEach(x => x.classList.remove("over", "dragging"));
        });

        /* ---------- 사진 설명 달기 ---------- */
        const capDlg = document.getElementById("capDlg");
        const capInput = document.getElementById("capInput");
        const capMsg = document.getElementById("capMsg");
        let capItem = null, capAlbum = null, capOpener = null;
        function openCaption(a, i) {
            capAlbum = a; capItem = a.items[i];
            capOpener = document.activeElement;
            document.getElementById("capImg").src = capItem.thumb;
            capInput.value = capItem.title || "";
            capMsg.textContent = ""; capMsg.style.color = "";
            capDlg.hidden = false;
            capInput.focus(); capInput.select();
        }
        function closeCaption() { capDlg.hidden = true; if (capOpener && document.contains(capOpener)) capOpener.focus(); }
        document.getElementById("capCancel").onclick = closeCaption;
        capDlg.addEventListener("click", e => { if (e.target === capDlg) closeCaption(); });
        document.getElementById("capForm").addEventListener("submit", async e => {
            e.preventDefault();
            const title = capInput.value.trim();
            capMsg.textContent = "저장하는 중…"; capMsg.style.color = "";
            try {
                await api(`api/items/${encodeURIComponent(capItem.id)}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title }) });
                capItem.title = title;
                capDlg.hidden = true;
                renderPhotos(capAlbum);
                setStatus(title ? "설명을 저장했어요." : "설명을 지웠어요.");
                const t = document.querySelector(`.tile[data-id="${CSS.escape(capItem.id)}"] [data-edit]`);
                if (t) t.focus();
            } catch (err) {
                if (err.status === 401) authed = false;
                capMsg.textContent = err.status === 401 ? "로그인이 풀렸어요. '사진·영상 올리기'에서 다시 로그인해 주세요." : err.message;
                capMsg.style.color = "var(--err)";
            }
        });
        document.addEventListener("keydown", e => { if (e.key === "Escape" && !capDlg.hidden) closeCaption(); });

        /* ---------- 확대 보기 + 앨범 음악 ---------- */
        const viewer = document.getElementById("viewer");
        const media = document.getElementById("viewerMedia");
        const cap = document.getElementById("viewerCap");
        const musicBtn = document.getElementById("musicBtn");
        let list = [], cur = 0, opener = null;

        // 음악은 사진을 누르는 순간(사용자가 직접 조작한 순간)에 시작해야 휴대폰에서도 소리가 납니다.
        const audio = new Audio();
        audio.loop = true; audio.volume = 0.55; audio.preload = "none";
        let musicOn = true;
        try { musicOn = localStorage.getItem("fa_music") !== "0"; } catch (e) {}

        function syncMusic(it) {
            const track = it.music || null;
            musicBtn.hidden = !track;
            musicBtn.classList.toggle("off", !musicOn);
            musicBtn.setAttribute("aria-label", musicOn ? "음악 끄기" : "음악 켜기");
            if (!track || !musicOn || it.type === "video") { audio.pause(); return track; }
            if (audio.getAttribute("data-src") !== track.src) { audio.src = track.src; audio.setAttribute("data-src", track.src); }
            audio.play().catch(() => {});
            return track;
        }
        musicBtn.onclick = () => {
            musicOn = !musicOn;
            try { localStorage.setItem("fa_music", musicOn ? "1" : "0"); } catch (e) {}
            show(cur);
        };

        /* 슬라이드쇼: 사진은 몇 초마다, 영상은 끝나면 다음으로. 마지막 장에서 멈춥니다. */
        const playBtn = document.getElementById("playBtn");
        const speedBtn = document.getElementById("speedBtn");
        const progress = document.getElementById("progress");
        const bar = document.getElementById("progressBar");
        const SPEEDS = [3, 4, 6, 8];
        let slideOn = false, slideSec = 4, slideTimer = null;
        try { const v = +localStorage.getItem("fa_sec"); if (SPEEDS.includes(v)) slideSec = v; } catch (e) {}

        function paintSlideUi() {
            playBtn.textContent = slideOn ? "❚❚ 멈춤" : "▶ 자동 재생";
            playBtn.setAttribute("aria-label", slideOn ? "자동 재생 멈추기" : "자동 재생 시작");
            speedBtn.textContent = `${slideSec}초`;
            progress.hidden = !slideOn;
        }
        function clearSlide() { clearTimeout(slideTimer); slideTimer = null; bar.style.transition = "none"; bar.style.width = "0"; }
        function stopSlide() { slideOn = false; clearSlide(); paintSlideUi(); }
        function advance() {
            if (!slideOn) return;
            if (cur >= list.length - 1) { stopSlide(); return; }
            show(cur + 1);
        }
        function armSlide() {
            clearSlide(); paintSlideUi();
            if (!slideOn) return;
            if (list[cur].type === "video") { const v = media.querySelector("video"); if (v) v.onended = advance; return; }
            void bar.offsetWidth;
            bar.style.transition = `width ${slideSec}s linear`; bar.style.width = "100%";
            slideTimer = setTimeout(advance, slideSec * 1000);
        }
        playBtn.onclick = () => {
            if (slideOn) { stopSlide(); return; }
            slideOn = true;
            if (cur >= list.length - 1 && list.length > 1) show(0); else armSlide();
        };
        speedBtn.onclick = () => {
            slideSec = SPEEDS[(SPEEDS.indexOf(slideSec) + 1) % SPEEDS.length];
            try { localStorage.setItem("fa_sec", String(slideSec)); } catch (e) {}
            paintSlideUi();
            if (slideOn) armSlide();
        };

        function show(i) {
            cur = (i + list.length) % list.length;
            const it = list[cur];
            media.innerHTML = it.type === "video"
                ? `<video src="${esc(it.src)}" poster="${esc(it.thumb)}" controls autoplay playsinline></video>`
                : `<img src="${esc(it.src)}" alt="${esc(it.title)}">`;
            const track = syncMusic(it);
            const note = track && musicOn && it.type !== "video" ? `♪ ${esc(track.title)} · ` : "";
            cap.innerHTML = `${it.title ? esc(it.title) : ""}<small>${note}${it.album ? esc(it.album) + " · " : ""}${cur + 1} / ${list.length}</small>`;
            const nx = list[(cur + 1) % list.length];
            if (nx && nx.type !== "video") new Image().src = nx.src;   // 다음 사진 미리 받기
            armSlide();
        }
        function openViewer(items, i, from, autoplay = false) {
            list = items; opener = from;
            slideOn = autoplay;
            show(i);
            viewer.classList.add("open");
            document.documentElement.classList.add("lock");
            viewer.tabIndex = -1;
            viewer.focus();            // 스페이스바가 '닫기'를 누르지 않도록 대화상자 자체에 포커스
        }
        function closeViewer() {
            stopSlide();
            media.innerHTML = "";
            audio.pause();
            try { audio.currentTime = 0; } catch (e) {}
            viewer.classList.remove("open");
            document.documentElement.classList.remove("lock");
            if (opener && document.contains(opener)) opener.focus();
        }
        viewer.querySelector(".close").onclick = closeViewer;
        viewer.querySelector(".prev").onclick = () => show(cur - 1);
        viewer.querySelector(".next").onclick = () => show(cur + 1);
        viewer.addEventListener("click", e => { if (e.target === viewer) closeViewer(); });
        document.addEventListener("keydown", e => {
            if (!viewer.classList.contains("open")) return;
            if (e.key === "Escape") closeViewer();
            if (e.key === "ArrowLeft") show(cur - 1);
            if (e.key === "ArrowRight") show(cur + 1);
            if (e.key === " " && !["BUTTON", "VIDEO", "INPUT"].includes(e.target.tagName)) { e.preventDefault(); playBtn.click(); }
        });
        let x0 = null;
        viewer.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
        viewer.addEventListener("touchend", e => {
            if (x0 === null) return;
            const dx = e.changedTouches[0].clientX - x0;
            if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1));
            x0 = null;
        });

        init();
    </script>
</body>

</html>
